  <title>Checkout — Bukchon Wool</title>
</head>
<body>
<!-- include: header.html -->
<main id="main">
  <div class="container">
    <h1>Checkout</h1>
    <div class="checkout-layout">
      <form id="checkout-form" class="checkout-form" action="#">
        <h2>Shipping details</h2>
        <div class="form-row">
          <label for="checkout-name">Full name</label>
          <input id="checkout-name" type="text" name="name" autocomplete="name" required>
        </div>
        <div class="form-row">
          <label for="checkout-email">Email</label>
          <input id="checkout-email" type="email" name="email" autocomplete="email" required>
          <p id="checkout-email-hint" class="field-hint">We'll send your receipt here.</p>
        </div>
        <div class="form-row">
          <label for="checkout-phone">Phone</label>
          <input id="checkout-phone" type="tel" name="phone" autocomplete="tel" required>
          <p id="checkout-phone-hint" class="field-hint">For delivery updates only.</p>
        </div>
        <div class="form-row">
          <label for="checkout-address">Street address</label>
          <input id="checkout-address" type="text" name="address" autocomplete="street-address" required>
        </div>
        <div class="form-row">
          <label for="checkout-city">City</label>
          <input id="checkout-city" type="text" name="city" autocomplete="address-level2" required>
        </div>
        <div class="form-row">
          <label for="checkout-postal">Postal code</label>
          <input id="checkout-postal" type="text" name="postal" autocomplete="postal-code" required>
        </div>
        <button id="checkout-submit-button" type="submit" class="btn-primary">Place order</button>
        <p id="checkout-form-status" class="form-status" hidden></p>
      </form>

      <aside class="order-summary">
        <h2>Order summary</h2>
        <ul class="summary-list">
          <li>Navy wool coat (Size M · Navy) — KRW 289,000</li>
          <li>Oatmeal knit scarf (One size · Oatmeal) — KRW 59,000</li>
          <li>Shipping — Free</li>
          <li><strong>Total — KRW 348,000</strong></li>
        </ul>
        <p id="checkout-summary-note" class="summary-note">This is a demo store. No order is placed.</p>
      </aside>
    </div>
  </div>
</main>
<!-- include: newsletter.html -->
<!-- include: footer.html -->
<script src="js/main.js"></script>
</body>
</html>
